name: Build APK

# Copy this file to .github/workflows/build.yml to enable automatic APK builds.
# Every push builds a signed release APK and attaches it to the GitHub release
# (tag RELEASE_TAG below, created automatically if it does not exist yet).

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHORTS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHORTS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHORTS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHORTS_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shorts.jks"
            echo "SHORTS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SHORTS_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "SHORTS_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/shorts.jks" \
              -alias shorts -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass shortsapp -keypass shortsapp \
              -dname "CN=Shorts, OU=Shorts, O=Shorts, L=NA, S=NA, C=NA"
            echo "SHORTS_KEYSTORE_PASSWORD=shortsapp" >> $GITHUB_ENV
            echo "SHORTS_KEY_ALIAS=shorts" >> $GITHUB_ENV
            echo "SHORTS_KEY_PASSWORD=shortsapp" >> $GITHUB_ENV
          fi
          echo "SHORTS_KEYSTORE=$RUNNER_TEMP/shorts.jks" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          TAG="${{ github.ref_type == 'tag' && github.ref_name || env.RELEASE_TAG }}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "dist/shorts-$TAG.apk"
          ls -l dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorts-apk
          path: dist/*.apk

      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Shorts $TAG" \
              --notes "Local Shorts player - pick a folder, swipe through your videos."
          fi
          gh release upload "$TAG" dist/*.apk --clobber
